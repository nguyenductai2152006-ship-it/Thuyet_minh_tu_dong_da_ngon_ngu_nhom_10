spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: identity-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/auth/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway