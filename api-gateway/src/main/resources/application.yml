spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: identity-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/auth/**

            - id: poi-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/pois/**

            - id: localization-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/localizations/**

            - id: audio-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/audio/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway