<text x="35" y="620" font-size="16" text-anchor="start" font-weight="400" fill="#26374d">Nét đứt biểu diễn tham chiếu nghiệp vụ theo poi_id. DDL bàn giao không khai báo FOREIGN KEY cho ba liên kết này.</text>
<text x="35" y="648" font-size="16" text-anchor="start" font-weight="400" fill="#26374d">Tài khoản có vai trò truy cập ở tầng ứng dụng. visitor_id và session_id là định danh theo dõi, không nối với users.</text>
