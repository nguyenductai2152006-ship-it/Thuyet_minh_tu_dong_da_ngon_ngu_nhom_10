<text x="494" y="598" font-size="15" text-anchor="start" font-weight="400" fill="#26374d">pois.id → analytics_events.poi_id (có thể NULL)</text>
<text x="36" y="845" font-size="16" text-anchor="start" font-weight="400" fill="#26374d">PK: khóa chính  •  UQ: khóa duy nhất  •  L: tham chiếu logic  •  †: cột bổ sung qua migration/entity</text>
<text x="36" y="875" font-size="16" text-anchor="start" font-weight="400" fill="#26374d">Bảng kỹ thuật ngoài mô hình nghiệp vụ: pois_backup_20261013, schema_migrations và timestamp_normalization_audit.</text>
<text x="36" y="905" font-size="16" text-anchor="start" font-weight="400" fill="#26374d">Mũi tên nét đứt từ pois.id cho biết cột đối chiếu; các quan hệ này không được MySQL áp ràng buộc FK trong DDL bàn giao.</text>
