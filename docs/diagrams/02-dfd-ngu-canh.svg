<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" role="img"><title>DFD ngữ cảnh</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#225f90"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="49" font-size="31" text-anchor="start" font-weight="750" fill="#26374d">DFD ngữ cảnh</text>
<text x="37" y="80" font-size="16" text-anchor="start" font-weight="400" fill="#26374d">Phạm vi nghiệp vụ theo Use Case tổng quát</text>
<rect x="35" y="231" width="200" height="60" rx="3" fill="#fff0d4" stroke="#225f90" stroke-width="2"/>
<text x="135" y="267" font-size="18" text-anchor="middle" font-weight="700" fill="#26374d">Khách tham quan</text>
<circle cx="620" cy="263" r="87" fill="#eaf4fd" stroke="#225f90" stroke-width="2"/>
<text x="620" y="248" font-size="14" text-anchor="middle" font-weight="700" fill="#26374d">0</text>
<text x="620" y="268" font-size="14" text-anchor="middle" font-weight="700" fill="#26374d">Hệ thống thuyết minh</text>
<text x="620" y="288" font-size="14" text-anchor="middle" font-weight="700" fill="#26374d">tự động đa ngôn ngữ</text>
<rect x="1005" y="231" width="200" height="60" rx="3" fill="#fff0d4" stroke="#225f90" stroke-width="2"/>
<text x="1105" y="267" font-size="18" text-anchor="middle" font-weight="700" fill="#26374d">Quản trị viên</text>
<path d="M135 231V155H574V189" fill="none" stroke="#225f90" stroke-width="2" marker-end="url(#arrow)" />
<text x="342" y="116" font-size="15" text-anchor="middle" font-weight="400" fill="#26374d">Mã QR, địa điểm, ngôn ngữ, vị trí, câu hỏi</text>
<text x="342" y="137" font-size="15" text-anchor="middle" font-weight="400" fill="#26374d">và sự kiện sử dụng</text>
<path d="M574 337V367H135V291" fill="none" stroke="#225f90" stroke-width="2" marker-end="url(#arrow)" />
<text x="337" y="392" font-size="15" text-anchor="middle" font-weight="400" fill="#26374d">Danh mục, bản dịch, audio, bản đồ và trả lời tra cứu</text>
<path d="M1105 231V155H666V189" fill="none" stroke="#225f90" stroke-width="2" marker-end="url(#arrow)" />
<text x="897" y="116" font-size="15" text-anchor="middle" font-weight="400" fill="#26374d">Thông tin đăng nhập, yêu cầu quản lý và thống kê</text>
<text x="897" y="137" font-size="15" text-anchor="middle" font-weight="400" fill="#26374d">kèm token khi cần xác thực</text>
<path d="M666 337V367H1105V291" fill="none" stroke="#225f90" stroke-width="2" marker-end="url(#arrow)" />
<text x="902" y="392" font-size="15" text-anchor="middle" font-weight="400" fill="#26374d">Kết quả xác thực (JWT), cập nhật và số liệu thống kê</text>
<text x="620" y="442" font-size="16" text-anchor="middle" font-weight="400" fill="#26374d">Khách tham quan = Visitor  •  Quản trị viên = ADMIN</text>
</g></svg>
