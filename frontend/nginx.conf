limit_req_zone $binary_remote_addr zone=events:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
server {
 listen 80; server_name _;
 root /usr/share/nginx/html; index index.html;
 client_max_body_size 64k; limit_req_status 429;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options SAMEORIGIN always;
 location = /api/analytics/events { limit_req zone=events burst=40 nodelay; client_max_body_size 4k; proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s; }
 location = /api/v1/auth/login { limit_req zone=login burst=10 nodelay; proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s; }
 location /api/ { proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s; }
 location /audio/ { try_files $uri =404; }
 location /Images/ { try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
